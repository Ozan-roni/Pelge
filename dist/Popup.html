<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control</title>
    <link rel="stylesheet" href="styles/App.css" />
  </head>
  <body class="PopupBody">
    <main class="PopupCard">
      <header class="PopupHeader"><div class="Brand"><img src="assets/ControlSelectedBlackIcon48.png" alt="" /><div><h1>Control</h1><p>Digital wellbeing</p></div></div><span class="PopupBadge">Active</span></header>
      <section class="PopupStatus" aria-label="Today’s activity"><div><span class="PopupStatusLabel">Today</span><strong id="PopupUsageTotal">0 min</strong></div><p>foreground time</p></section>
      <div class="PopupApplications">
        <button class="PopupApplication" id="PopupInstagramButton" type="button"><span class="PopupApplicationIcon Instagram"><img src="assets/Instagram.svg" alt="" /></span><span><strong>Instagram</strong><p>Direct Messages only</p></span><span class="PopupApplicationArrow">↗</span></button>
        <button class="PopupApplication" id="PopupXButton" type="button"><span class="PopupApplicationIcon X"><img src="assets/X.svg" alt="" /></span><span><strong>X</strong><p>Direct Messages only</p></span><span class="PopupApplicationArrow">↗</span></button>
        <button class="PopupApplication" id="PopupSnapchatButton" type="button"><span class="PopupApplicationIcon Snapchat"><img src="assets/Snapchat.svg" alt="" /></span><span><strong>Snapchat</strong><p>Chat and camera only</p></span><span class="PopupApplicationArrow">↗</span></button>
        <button class="PopupApplication" id="PopupYouTubeButton" type="button"><span class="PopupApplicationIcon YouTube"><img src="assets/YouTube.svg" alt="" /></span><span><strong>YouTube</strong><p>Regular videos only</p></span><span class="PopupApplicationArrow">↗</span></button>
        <button class="PopupApplication" id="PopupTikTokButton" type="button"><span class="PopupApplicationIcon TikTok"><img src="assets/TikTok.svg" alt="" /></span><span><strong>TikTok</strong><p>Search and messages only</p></span><span class="PopupApplicationArrow">&#8599;</span></button>
      </div>
      <footer class="PopupFooter"><p>Private account.<br />Local protection.</p><button class="PopupDashboardButton" id="PopupSettingsButton" type="button">Open Control</button></footer>
    </main>
    <script src="scripts/Popup.js"></script>
  </body>
</html>
